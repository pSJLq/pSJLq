name: dailies

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dailies
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Render the contact sheet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: python3 .github/scripts/dailies.py

      - name: Commit the contact sheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/dailies-dark.svg assets/dailies-light.svg
          if git diff --cached --quiet; then
            echo "Dailies unchanged."
            exit 0
          fi
          git commit -m "chore: refresh dailies"
          git push
